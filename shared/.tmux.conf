# ┌──────────────────────────────────────────────────────────────────────────┐
# │ STARTUP                                                                  │
# └──────────────────────────────────────────────────────────────────────────┘

# === PLATFORM DETECTION ===
if-shell '[ "$(uname -s)" = Darwin ]' {
    set -g @os-icon ''
} {
    set -g @os-icon 'L'
}


# ┌──────────────────────────────────────────────────────────────────────────┐
# │ COLOUR DEFINITIONS                                                       │
# └──────────────────────────────────────────────────────────────────────────┘

# === WINDOW ===
set -g          @w-default-bg             'colour236'   # 236 #303030
set -g          @w-default-fg             'colour244'   # 244 #808080
set -g          @w-active-bg              'colour0'     #   0 #000000
set -g          @w-active-fg              'colour7'     #   7 #......

# === PANE ===
set -g          @p-default-border-bg      'colour236'   # 236 #303030
set -g          @p-default-border-fg      'colour244'   # 244 #808080
set -g          @p-active-border-bg       'colour88'    #  88 #870000
set -g          @p-active-border-fg       'colour196'   # 196 #ff0000

# === STATUS BAR ===
set -g          @s-bg                     'colour0'     #   0 #000000
set -g          @s-fg                     'colour244'   # 244 #808080

# === TAB BADGE ===
set -g          @t-badge-default-bg       'colour236'   # 236 #303030
set -g          @t-badge-default-fg       'colour244'   # 244 #808080
set -g          @t-badge-active-bg        'colour88'    #  88 #870000
set -g          @t-badge-active-fg        'colour214'   # 214 #ffaf00
set -g          @t-badge-bell-bg          'colour0'     #   0 #000000

# === TAB NAME ===
set -g          @t-name-default-bg        'colour244'   # 244 #808080
set -g          @t-name-default-fg        'colour236'   # 236 #303030
set -g          @t-name-active-bg         'colour214'   # 214 #ffaf00
set -g          @t-name-active-fg         'colour0'     #   0 #000000
set -g          @t-name-bell-bg           'colour0'     #   0 #000000
set -g          @t-name-bell-fg           'colour214'   # 214 #ffaf00


# ┌──────────────────────────────────────────────────────────────────────────┐
# │ GENERAL SETTINGS                                                         │
# └──────────────────────────────────────────────────────────────────────────┘

set -g          allow-passthrough         on            # Allow passthrough of unknown escape sequences (for true colour support)
set -g          mouse                     on            # Enable mouse support (clickable windows, panes, resizable panes)
set -g          focus-events              on            # Enable focus events (for terminal focus detection)
set-option -g   pane-border-status        off           # Disable pane border status (no extra line at the bottom of each pane)
set-option -g   allow-rename              off           # Prevents tmux from renaming windows automatically


# ┌──────────────────────────────────────────────────────────────────────────┐
# │ WINDOW & PANE STYLES                                                     │
# └──────────────────────────────────────────────────────────────────────────┘

set-option -g   window-style              'bg=#{@w-default-bg},fg=#{@w-default-fg}'
set-option -g   window-active-style       'bg=#{@w-active-bg},fg=#{@w-active-fg}'
set-option -g   pane-border-style         'bg=#{@p-default-border-bg},fg=#{@p-default-border-fg}'
set-option -g   pane-active-border-style  'bg=#{@p-active-border-bg},fg=#{@p-active-border-fg}'


# ┌──────────────────────────────────────────────────────────────────────────┐
# │ STATUS BAR                                                               │
# └──────────────────────────────────────────────────────────────────────────┘

set -g          status-justify            left
set -g          status-style              'bg=#{@s-bg},fg=#{@s-fg}'
set -g          status-interval           2             # Update the status bar every 2 seconds
setw -g         window-status-current-style default     # tmux 3.8 uses underscore as default, not reverse
setw -g         window-status-separator   ""

# === LEFT STATUS (BADGE & INFO) ===

set -g          status-left-length        16            # Set the maximum length of the left status area

# Build left badge with the active badge style
set -gF         @left-badge-start         '#[bg=#{@t-badge-active-bg},fg=#{@t-badge-active-fg}]'
set -gF         @left-badge-value         '#{@os-icon}'
set -gF         @left-badge               '#{@left-badge-start}#{@left-badge-value}'

# Build left info with the active name style
set -gF         @left-info-start          '#[bg=#{@t-name-active-bg},fg=#{@t-name-active-fg}]'
set -gF         @left-info-value          '#{?#{==:#h,M-JVQ301G4CQ},Bouvet,#h}'
set -gF         @left-info                '#{@left-info-start}#{@left-info-value}'

# Assemble the left status with separators
set -gF         @l                        '#[reverse]▌#[noreverse]'
set -gF         @left                     '#{@left-badge}#{@l}#{@left-info}#{@l}'
set -g status-left '#{@left}'

# === CENTRE STATUS : DEFAULT TAB ===

# Build the default tab badge
set -gF @tab-default-badge-style '#[bg=#{@t-badge-default-bg},fg=#{@t-badge-default-fg}]'
set -g @tab-default-badge-value '#{window_index}'
set -g @tab-default-badge '#{@tab-default-badge-style}#{E:@tab-default-badge-value}'

# Build the default tab name
set -gF @tab-default-name-style '#[bg=#{@t-name-default-bg},fg=#{@t-name-default-fg}]'
set -g @tab-default-name-value '#{window_name}'
set -g @tab-default-name '#{@tab-default-name-style}#{E:@tab-default-name-value}'

# Assemble the default tab with separators
set -gF @d1 '#[none]#[bg=#{@t-badge-default-bg},fg=#{@s-bg}]▌#[none]'
set -gF @d2 '#[bg=#{@t-name-default-bg},fg=#{@t-badge-default-bg}]▌#[none]'
set -gF @d3 '#[bg=#{@s-bg},fg=#{@t-name-default-bg}]▌#[none]'
set -g @tab-default '#{@d1}#{E:@tab-default-badge}#{@d2}#{E:@tab-default-name}#{@d3}'

# === CENTRE STATUS : ACTIVE TAB ===

# Build the active tab badge
set -gF @tab-active-badge-style '#[bg=#{@t-badge-active-bg},fg=#{@t-badge-active-fg}]'
set -g @tab-active-badge-value '#{window_index}'
set -g @tab-active-badge '#{@tab-active-badge-style}#{E:@tab-active-badge-value}'

# Build the active tab name
set -gF @tab-active-name-style '#[bg=#{@t-name-active-bg},fg=#{@t-name-active-fg}]'
set -g @tab-active-name-value '#{window_name}'
set -g @tab-active-name '#{@tab-active-name-style}#{E:@tab-active-name-value}'

# Assemble the active tab with separators
set -gF @a1 '#[none]#[fg=#{@s-bg},bg=#{@t-badge-active-bg}]▌#[none]'
set -gF @a2 '#[bg=#{@t-name-active-bg},fg=#{@t-badge-active-bg}]▌#[none]'
set -gF @a3 '#[bg=#{@s-bg},fg=#{@t-name-active-bg}]▌#[none]'
set -g @tab-active '#{@a1}#{E:@tab-active-badge}#{@a2}#{E:@tab-active-name}#{@a3}'

# === CENTRE STATUS : BELL TAB ===

# Build the bell tab badge
set -g @tab-bell-badge '#{A/10:#[fg=colour196]●,#[fg=colour88]◉}'

# Build the bell tab name
set -gF @tab-bell-name-style '#[bg=#{@t-name-bell-bg},fg=#{@t-name-bell-fg},bold]'
set -g @tab-bell-name-value '#{window_name}'
set -g @tab-bell-name '#{@tab-bell-name-style}#{E:@tab-bell-name-value}#[none]'

# Assemble the bell tab with separators
set -gF @b1 '#[none]#[bg=#{@s-bg},fg=#{@t-badge-bell-bg}]▌#[none]'
set -gF @b2 '#[bg=#{@t-name-bell-bg},fg=#{@t-badge-bell-bg}]▌#[none]'
set -gF @b3 '#[fg=#{@t-name-bell-bg},bg=#{@s-bg}]▌#[none]'
set -g @tab-bell '#{@b1}#{E:@tab-bell-badge}#{@b2}#{E:@tab-bell-name}#{@b3}'

setw -g window-status-format '#{?window_bell_flag,#{E:@tab-bell},#{E:@tab-default}}'
setw -g window-status-current-format '#{E:@tab-active}'

# === RIGHT STATUS (PREFIX, DATE & TIME) ===

# Window is zoomed
set -g @zoomed '#{?window_zoomed_flag,#[fg=colour214]⧉,#[fg=colour237]⧉#[fg=colour214]} '

# Client prefix key pressed
set -g @prefix '#{?client_prefix,#[fg=colour214]⌘,#[fg=colour237]⌘#[fg=colour214]} '
#set -g @prefix '#{?client_prefix,#[fg=colour214]#{A:,,,,,} ,#[fg=colour234]  }'

# Synchronized?
set -g @sync '#{?pane_synchronized,#[fg=colour214]⇄,#[fg=colour237]⇄#[fg=colour214]} '

# Client colours
set -g @colours-true '◉'
set -g @colours-256 '◎'
set -g @colours-16 '○'
set -g @colours '#{?#{==:#{client_colours},16777216},#{@colours-true},#{?#{==:#{client_colours},256},#{@colours-256},#{?#{==:#{client_colours},16},#{@colours-16},?}}}'

#set -g @utf8 '#[fg=colour214]#{?client_utf8,🧊🦞,  } '

# Build the date with the active badge style
set -g @date '#[fg=#{@t-badge-active-fg},bg=#{@t-badge-active-bg}]%d.%m.%Y'

# Build the time with the active name style
set -g @time '#[fg=#{@t-name-active-fg},bg=#{@t-name-active-bg}]%H:%M'

# Assemble the right status with separators
set -gF @r1 '#[none]#[bg=#{@t-badge-active-bg},fg=#{@s-bg}]▌#[none]'
set -gF @r2 '#[bg=#{@t-name-active-bg},fg=#{@t-badge-active-bg}]▌#[none]'
set -g status-right '#{E:@zoomed}#{E:@prefix}#{E:@sync}#{E:@colours}#{@r1}#{T:@date}#{@r2}#{T:@time}'

# ┌──────────────────────────────────────────────────────────────────────────┐
# │ KEY BINDINGS                                                             │
# └──────────────────────────────────────────────────────────────────────────┘

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split panes using | and - instead of " and %
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file with 'r'
bind r source-file ~/.tmux.conf

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Toggle synchronize-panes with 'e'
bind e run-shell "~/.tmux/toggle_synchronize.sh"

# Bindings for session management
bind Æ source-file ~/.tmux/session_default.conf
